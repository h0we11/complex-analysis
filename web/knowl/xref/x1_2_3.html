<div class="para">Show that <span class="process-math">\(z\overline{z}\)</span> is always a real number.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#x1_2_3-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<div class="solution solution-like knowl__content">
<div class="para">Let <span class="process-math">\(z=x+iy\)</span> be an arbitrary complex number. Then <span class="process-math">\(z \overline{z}=(x+iy)(x-iy)=x^2+y^2\text{,}\)</span> which is obviously a real number.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#x1_2_3-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
