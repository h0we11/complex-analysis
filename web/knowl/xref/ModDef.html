</h3>
<div class="para logical">
<div class="para">The modulus, or absolute value <em class="emphasis">,</em>of the complex number <span class="process-math">\(z=x+iy\)</span> is a nonnegative real number denoted by <span class="process-math">\(|z|\)</span> and defined by the relation</div>
<div class="displaymath process-math">
\begin{equation}
|z|=\sqrt{x^2+y^2}\text{.}\tag{1.3.1}
\end{equation}
</div>
