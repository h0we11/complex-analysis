<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.4.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title"><span class="process-math">\(\;\; \boldsymbol{\sin z}, \quad \text{and} \quad \boldsymbol{\cos z}\)</span>.</span>
</h3>
<div class="para logical">
<div class="displaymath process-math">
\begin{equation*}
\sin z=\sum_{n=0}^{\infty}(-1)^n\frac{z^{2n+1}}{(2n+1)!}, \quad \text{and} \quad
\cos z = \sum\limits_{n=0}^{\infty}(-1)^n\frac{z^{2n}}{(2n)!}\text{.}
\end{equation*}
</div>
