</h3>
<div class="para logical">
<div class="para">For <span class="process-math">\(a \ge 0\)</span> the unit step function <span class="process-math">\(U_a(t)\)</span> is</div>
<div class="displaymath process-math">
\begin{equation*}
U_a(t) = \begin{cases}
0 \amp \text{for} \quad t \lt a,\\ 
1 \amp  \text{for} \quad t &gt; a. 
\end{cases}
\end{equation*}
</div>
