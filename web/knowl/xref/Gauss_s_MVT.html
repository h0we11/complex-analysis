<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.6.2</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Gauss’s mean value theorem.</span>
</h3>
<div class="para logical">
<div class="para">If <span class="process-math">\(f\)</span> is analytic in a simply connected domain <span class="process-math">\(D\)</span> that contains the circle <span class="process-math">\(C_R(z_0)=\{z:|z-z_0|=R\}\text{,}\)</span> then</div>
<div class="displaymath process-math">
\begin{equation*}
f(z_0) = \frac{1}{2\pi}\int_0^{2\pi}f(z_0+Re^{i\theta})\,d\theta\text{.}
\end{equation*}
</div>
