<div class="para logical">
<div class="para">(Integration of <span class="process-math">\(f(t)\)</span>] Let <span class="process-math">\(f(t)\)</span> be continuous for <span class="process-math">\(t \ge 0\text{,}\)</span> and of exponential order. Further, let <span class="process-math">\(F(s)\)</span> be its Laplace transform, then</div>
<div class="displaymath process-math">

\mathcal{L}\left(\int_0^tf(\tau)\,d\tau\right) =\frac{F(s)}{s}.
\end{equation*}
