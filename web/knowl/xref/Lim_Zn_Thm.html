<div class="para logical">
<div class="para">Let <span class="process-math">\(z_n=x_n+iy_n\)</span> and <span class="process-math">\(\zeta =u+iv\text{.}\)</span> Then,</div>
<div class="displaymath process-math">

\end{align}
</div>
